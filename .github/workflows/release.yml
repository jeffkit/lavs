name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify npm auth (fail fast on stale NPM_TOKEN)
        run: |
          # npm returns a misleading E404 (not E401) on PUT when the auth
          # token is missing/expired/lacks publish rights — see npm/cli#1637.
          # Probe with `npm whoami` so the real cause shows up in the log
          # instead of a cryptic 404 deep inside `changeset publish`.
          if ! npm whoami --registry https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "::error::NPM_TOKEN is missing, expired, or lacks publish permission."
            echo "::error::npm whoami failed — verify the secret at"
            echo "::error::  https://github.com/jeffkit/lavs/settings/secrets/actions"
            echo "::error::The token must be a classic automation token or a granular"
            echo "::error::token with read+write on lavs-types, lavs-runtime, lavs-client."
            exit 1
          fi
          echo "Authenticated as: $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Changeset status (pre-check)
        id: changeset-status
        run: pnpm changeset status
        continue-on-error: true

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
